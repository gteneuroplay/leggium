# SysLegis — proxy reverso para syslegis.com (HTTP; use Certbot para HTTPS).
# Copie para a VPS em /etc/nginx/sites-available/ e ajuste caminhos SSL após certbot.

upstream syslegis_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name syslegis.com www.syslegis.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://syslegis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

